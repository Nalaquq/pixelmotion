[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelmotion"
version = "0.1.0"
description = "Manim-style animated slides for math and computer vision, built on matplotlib"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sean Gleason" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
# mkdocs 2.0 drops the plugin system; pymdown 12 breaks mkdocstrings 1.0 highlighting
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26",
        "pymdown-extensions<12"]

[tool.setuptools.packages.find]
include = ["pixelmotion*"]
